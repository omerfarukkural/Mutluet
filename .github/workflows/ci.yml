name: CI — Build & Check

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (build + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:3001/api
          VITE_ENV: production

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend (build + type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Type check
        run: pnpm exec tsc --noEmit
        continue-on-error: true

      - name: Build
        run: pnpm build

  # ── Docker build check ────────────────────────────────────────────────────
  docker:
    name: Docker image build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security audit ────────────────────────────────────────────────────────
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit frontend deps
        run: pnpm audit --audit-level high || true

      - name: Audit backend deps
        working-directory: backend
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high || true
