name: mutluet_app
description: Gönüllülük ve sosyal etki platformu
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.1
  # riverpod: ^2.4.9 # Planda provider ile başlanması öneriliyor, şimdilik bunu kapalı tutuyorum.
  
  # Networking
  http: ^1.1.2
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^5.0.0
  
  # Backend (Azure) - Bu paket doğrudan Azure ile konuşmak için, ancak biz API üzerinden gideceğiz.
  # azure_storage: ^0.5.0 # Direkt Azure storage kullanımı MVP'de olmayabilir.
  
  # Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Payments
  # stripe_sdk: ^10.0.0 # Stripe paketi güncel değil, flutter_stripe kullanılmalı. Şimdilik eklemiyorum.
  
  # Media
  image_picker: ^1.0.5
  video_player: ^2.8.1
  
  # Notifications
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.2.0
  
  # Analytics
  firebase_analytics: ^10.7.4
  sentry_flutter: ^7.13.2
  
  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
