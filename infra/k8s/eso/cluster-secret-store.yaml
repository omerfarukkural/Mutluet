# External Secrets Operator — Azure Key Vault ClusterSecretStore
# Ön koşul: ESO kurulu olmalı ve Workload Identity yapılandırılmış olmalı
# Belge: https://external-secrets.io/v0.19.2/provider/azure-key-vault/
---
# ClusterSecretStore: Azure Key Vault bağlantı tanımı
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity   # AAD Pod Identity deprecated; Workload Identity kullan
      vaultUrl: "${AZURE_KEY_VAULT_URI}"
      serviceAccountRef:
        name: mutluet-backend
        namespace: mutluet-prod
---
# ExternalSecret: uygulama secret'larını vault'tan Kubernetes Secret'a senkronize et
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mutluet-app-secrets
  namespace: mutluet-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: mutluet-app-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: DATABASE-URL
  - secretKey: JWT_SECRET
    remoteRef:
      key: JWT-SECRET
  - secretKey: WORDPRESS_JWT_SECRET
    remoteRef:
      key: WORDPRESS-JWT-SECRET
  - secretKey: SENDGRID_API_KEY
    remoteRef:
      key: SENDGRID-API-KEY
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: STRIPE-SECRET-KEY
  - secretKey: STRIPE_WEBHOOK_SECRET
    remoteRef:
      key: STRIPE-WEBHOOK-SECRET
  - secretKey: CLOUDINARY_API_SECRET
    remoteRef:
      key: CLOUDINARY-API-SECRET
  - secretKey: SENTRY_DSN
    remoteRef:
      key: SENTRY-DSN
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: ANTHROPIC-API-KEY
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: OPENAI-API-KEY
  - secretKey: MONGODB_ATLAS_PRIVATE_KEY
    remoteRef:
      key: MONGODB-ATLAS-PRIVATE-KEY
