# Namespace — üretim ortamı, Pod Security Restricted profile ile
apiVersion: v1
kind: Namespace
metadata:
  name: mutluet-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Namespace — staging ortamı, Baseline profile ile
apiVersion: v1
kind: Namespace
metadata:
  name: mutluet-staging
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Namespace — CI/CD araçları için
apiVersion: v1
kind: Namespace
metadata:
  name: mutluet-ops
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: restricted
