# ServiceAccount — backend uygulaması için (Workload Identity ile)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mutluet-backend
  namespace: mutluet-prod
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
---
# Role — backend'in kendi namespace'indeki secret'lara erişimi
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: mutluet-prod
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames:
  - mutluet-app-secrets   # yalnızca bu secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-secret-reader
  namespace: mutluet-prod
subjects:
- kind: ServiceAccount
  name: mutluet-backend
  namespace: mutluet-prod
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
# ServiceAccount — CI/CD (Argo CD sync) için
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-deployer
  namespace: mutluet-ops
---
# ClusterRole — Argo CD'nin uygulamaları yönetmesi için (sınırlı)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-app-manager
rules:
- apiGroups: ["apps", ""]
  resources: ["deployments", "services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# NOT: cluster-admin BAĞIŞLANMAZ — en az yetki prensibi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-app-manager-binding
subjects:
- kind: ServiceAccount
  name: argocd-deployer
  namespace: mutluet-ops
roleRef:
  kind: ClusterRole
  name: argocd-app-manager
  apiGroup: rbac.authorization.k8s.io
