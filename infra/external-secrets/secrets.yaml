# External Secrets Operator Yapılandırması
# Azure Key Vault'tan Kubernetes Secret'larına otomatik senkronizasyon.
# Bootstrap .env → Azure Key Vault → ESO → Kubernetes Secret → Pod akışını uygular.
---
# ── ClusterSecretStore: Azure Key Vault ─────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault-store
spec:
  provider:
    azurekv:
      # Azure Key Vault URI — ortam değişkeninden alınır
      vaultUrl: "${AZURE_KEY_VAULT_URI}"
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets-sa
        namespace: external-secrets

---
# ── Mutluet API Secret'ları ──────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mutluet-api-secrets
  namespace: mutluet-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault-store
    kind: ClusterSecretStore
  target:
    name: mutluet-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE-URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: JWT-SECRET
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: STRIPE-SECRET-KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: STRIPE-WEBHOOK-SECRET
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: GOOGLE-CLIENT-ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: GOOGLE-CLIENT-SECRET
    - secretKey: FACEBOOK_APP_ID
      remoteRef:
        key: FACEBOOK-APP-ID
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef:
        key: FACEBOOK-APP-SECRET
    - secretKey: AZURE_COMMUNICATION_CONNECTION_STRING
      remoteRef:
        key: AZURE-COMMUNICATION-CONNECTION-STRING
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: SENDGRID-API-KEY
    - secretKey: WORDPRESS_JWT_SECRET
      remoteRef:
        key: WORDPRESS-JWT-SECRET

---
# ── Bitebimuv WordPress Entegrasyon Secret'ları ─────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bitebimuv-wp-secrets
  namespace: bitebimuv-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault-store
    kind: ClusterSecretStore
  target:
    name: bitebimuv-wp-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: WP_API_USERNAME
      remoteRef:
        key: WP-API-USERNAME
    - secretKey: WP_APP_PASSWORD
      remoteRef:
        key: WP-APP-PASSWORD

---
# ── Ajan Fabrikası AI Provider Secret'ları ──────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-factory-ai-secrets
  namespace: agent-factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault-store
    kind: ClusterSecretStore
  target:
    name: agent-factory-ai-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI-API-KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ANTHROPIC-API-KEY
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: GEMINI-API-KEY
    - secretKey: GITHUB_PAT
      remoteRef:
        key: GITHUB-PAT

---
# ── MongoDB Atlas Operatör Secret'ı ─────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-atlas-operator-api-key
  namespace: mutluet-prod
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-key-vault-store
    kind: ClusterSecretStore
  target:
    name: mongodb-atlas-operator-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: orgId
      remoteRef:
        key: MONGODB-ATLAS-ORG-ID
    - secretKey: publicApiKey
      remoteRef:
        key: MONGODB-ATLAS-PUBLIC-KEY
    - secretKey: privateApiKey
      remoteRef:
        key: MONGODB-ATLAS-PRIVATE-KEY
